name: CI Process

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:
    branches:
      - develop
      - release/*
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Run Build, Tests, and Coverage Checks
        # The 'install' phase executes all attached goals:
        # 1. 'test' (runs JUnit via surefire)
        # 2. 'jacoco:check' (runs coverage rule check)
        # 3. 'jacoco:report' (generates report)
        # This simplifies the CI and correctly executes the rules defined in pom.xml
        run: mvn clean install